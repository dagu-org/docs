type: graph

steps:
  - id: inspect
    action: ssh.run
    with:
      user: deploy
      host: api.example.com
      key: ~/.ssh/id_ed25519
      command: systemctl --failed
    output: STATUS

  - id: approve
    action: human.task
    depends: inspect
    with:
      prompt: "Approve remote recovery after reviewing: ${STATUS}"

  - id: recovery
    action: dag.run
    depends: approve
    with:
      dag: remote-recovery
      params:
        HOST: api.example.com

  - id: notify
    action: mail.send
    depends: recovery
    with:
      to: oncall@example.com
      from: dagu@example.com
      subject: Remote recovery completed
      message: The approved recovery command completed successfully.
---
name: remote-recovery
type: graph

params:
  - HOST: ""

steps:
  - id: restart
    action: ssh.run
    with:
      user: deploy
      host: ${HOST}
      key: ~/.ssh/id_ed25519
      command: sudo systemctl restart api

  - id: verify
    action: ssh.run
    depends: restart
    with:
      user: deploy
      host: ${HOST}
      key: ~/.ssh/id_ed25519
      command: systemctl is-active api
