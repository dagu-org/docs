type: graph

steps:
  - id: inspect
    action: ssh.run
    with:
      user: deploy
      host: api.example.com
      key: ~/.ssh/id_ed25519
      command: systemctl --failed
    output: STATUS

  - id: approve
    action: human.task
    depends: inspect
    with:
      prompt: "Approve remote recovery after reviewing: ${STATUS}"

  - id: recover
    action: ssh.run
    depends: approve
    with:
      user: deploy
      host: api.example.com
      key: ~/.ssh/id_ed25519
      command: sudo systemctl restart api

  - id: notify
    action: mail.send
    depends: recover
    with:
      to: oncall@example.com
      from: dagu@example.com
      subject: Remote recovery completed
      message: The approved recovery command completed successfully.
