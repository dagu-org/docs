type: graph

steps:
  - id: collect_context
    run: ./scripts/collect-errors.sh
    output: CONTEXT

  - id: propose_fix
    action: harness.run
    depends: collect_context
    timeout_sec: 300
    with:
      provider: opencode
      prompt: |
        Analyze this operational context and propose a safe fix.
        Do not modify files.

        ${CONTEXT}
    output: PLAN

  - id: review
    action: human.task
    depends: propose_fix
    with:
      prompt: "Review and approve OpenCode's plan: ${PLAN}"

  - id: apply
    run: ./scripts/apply-approved-fix.sh
    depends: review
