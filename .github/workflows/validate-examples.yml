name: Validate workflow examples

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out documentation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check out Dagu
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: dagucloud/dagu
          path: .dagu-source

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: .dagu-source/go.mod
          cache-dependency-path: .dagu-source/go.sum

      - name: Build Dagu
        working-directory: .dagu-source
        run: go build -o "$RUNNER_TEMP/dagu" ./cmd

      - name: Validate documentation examples
        env:
          DAGU_BIN: ${{ runner.temp }}/dagu
        run: node scripts/validate-examples.mjs
